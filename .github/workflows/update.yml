name: Daily update
on:
  schedule:
    - cron: "56 10 * * *"   # about 5:56 AM Eastern
  workflow_dispatch:
permissions:
  contents: write
concurrency: csm-update
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install eccodes
      - name: Get yesterday's histories from the gh-pages branch (or the seed on first run)
        run: |
          mkdir -p prev out
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            for f in history predlog cities watchlog; do git show FETCH_HEAD:$f.json > prev/$f.json; done
          else
            cp seed/*.json prev/
          fi
      - name: Build
        run: |
          set +e
          for try in 1 2; do
            python3 -I scripts/update.py build/template.txt build/states-albers-10m.json out/index.html prev/history.json out/history.json prev/predlog.json out/predlog.json prev/cities.json out/cities.json build/points.json prev/watchlog.json out/watchlog.json 2>&1 | tee run.log
            [ -s out/index.html ] && [ "${PIPESTATUS[0]}" = 0 ] && break
            sleep 120
          done
          test -s out/index.html
          if grep -q "CFS outlook skipped" run.log; then echo "::warning::CFS outlook skipped today"; fi
      - name: Publish to gh-pages (single commit, no history growth)
        run: |
          cd out && touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Daily update $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
